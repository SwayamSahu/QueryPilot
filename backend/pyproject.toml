[project]
name = "querypilot"
version = "1.0.0"
description = "Governed enterprise analytics copilot: natural language -> verified SQL -> evidence-backed answers"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110", "uvicorn[standard]>=0.29", "sqlalchemy>=2.0", "psycopg[binary]>=3.1", "sqlglot>=25",
  "pydantic>=2.6", "pydantic-settings>=2.2", "pyyaml>=6", "httpx>=0.27", "langgraph>=0.2",
  "scikit-learn>=1.4", "numpy>=1.26", "pandas>=2.1", "prometheus-client>=0.20", "pyjwt>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
embeddings = ["sentence-transformers>=3.0"]
mlops = ["mlflow>=2.12"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["querypilot*"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "UP007", "E731", "B905", "B023", "E702"]

[tool.pytest.ini_options]
testpaths = ["tests"]
