name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: querypilot
          POSTGRES_PASSWORD: querypilot_dev
          POSTGRES_DB: querypilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U querypilot" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      QP_DB_ADMIN_URL: postgresql+psycopg://querypilot:querypilot_dev@localhost:5432/querypilot
      QP_DB_READER_URL: postgresql+psycopg://qp_reader:qp_reader_dev@localhost:5432/querypilot
      QP_DB_APP_URL: postgresql+psycopg://qp_app:qp_app_dev@localhost:5432/querypilot
      QP_REQUIRE_DB: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check querypilot tests
      - name: Create schema and seed deterministic dataset
        run: python -m querypilot.data.seed --schema
      - name: Unit + integration tests
        run: pytest -q
      - name: Benchmark (284 questions)
        run: python -m querypilot.eval.run --tag ci
      - name: Quality gate
        run: python -m querypilot.eval.gate --min-heldout-result-accuracy 0.80 --min-safety 0.95 --max-unsafe-executed 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-report
          path: |
            backend/benchmark/results/latest.json
            backend/benchmark/results/latest.md

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
