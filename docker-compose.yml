# QueryPilot - everything free and open source.
#   docker compose up --build                                  # db + api + ui (rules planner, no LLM needed)
#   docker compose --profile llm up --build                    # + Ollama (local LLM)
#   docker compose --profile observability up --build          # + Prometheus + Grafana
#   docker compose --profile mlops up --build                  # + MLflow tracking server
name: querypilot

x-api-env: &api-env
  QP_DB_ADMIN_URL: postgresql+psycopg://querypilot:${POSTGRES_PASSWORD:-querypilot_dev}@${QP_DB_HOST:-db}:5432/querypilot
  QP_DB_READER_URL: postgresql+psycopg://qp_reader:qp_reader_dev@${QP_DB_HOST:-db}:5432/querypilot
  QP_DB_APP_URL: postgresql+psycopg://qp_app:qp_app_dev@${QP_DB_HOST:-db}:5432/querypilot
  # If Docker's internal DNS can't resolve "db", the entrypoint falls back to the port the db
  # container publishes on the host (reachable as host.docker.internal).
  QP_DB_FALLBACK_HOSTS: ${QP_DB_FALLBACK_HOSTS:-host.docker.internal}
  QP_DB_WAIT_SECONDS: ${QP_DB_WAIT_SECONDS:-90}
  # The synthetic dataset ends 2026-09-30; pin "today" so "last quarter" lands in the data.
  QP_REFERENCE_DATE: ${QP_REFERENCE_DATE:-2026-10-10}
  QP_JWT_SECRET: ${QP_JWT_SECRET:-change-me-in-production-please-32b}
  QP_CORS_ORIGINS: http://localhost:3000
  QP_PLANNER: ${QP_PLANNER:-hybrid}
  QP_LLM_PROVIDER: ${QP_LLM_PROVIDER:-none}          # set to "ollama" with --profile llm
  QP_LLM_BASE_URL: ${QP_LLM_BASE_URL:-http://ollama:11434}
  QP_LLM_MODEL: ${QP_LLM_MODEL:-qwen2.5-coder:7b}
  MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-file:///app/mlruns}

services:
  db:
    image: pgvector/pgvector:pg16
    networks:
      qpnet:
        aliases: [db, postgres]
    environment:
      POSTGRES_USER: querypilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-querypilot_dev}
      POSTGRES_DB: querypilot
    volumes:
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U querypilot -d querypilot"]
      interval: 5s
      retries: 20

  api:
    build: ./backend
    environment: *api-env
    depends_on:
      db: {condition: service_healthy}
    ports: ["8000:8000"]
    networks:
      qpnet:
        aliases: [api]
    extra_hosts: ["host.docker.internal:host-gateway"]  # makes the fallback work on Linux too
    restart: on-failure

  ui:
    build: ./frontend
    environment:
      # Read at runtime (no rebuild needed). Tried in order; the second is the host-published API port.
      API_URLS: ${API_URLS:-http://api:8000,http://host.docker.internal:8000}
    depends_on: [api]
    ports: ["3000:3000"]
    networks: [qpnet]
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped

  ollama:
    networks: [qpnet]
    profiles: [llm]
    image: ollama/ollama:latest
    volumes: [ollama:/root/.ollama]
    ports: ["11434:11434"]
    # first run:  docker compose exec ollama ollama pull qwen2.5-coder:7b

  prometheus:
    networks: [qpnet]
    profiles: [observability]
    image: prom/prometheus:latest
    volumes: [./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["9090:9090"]

  grafana:
    networks: [qpnet]
    profiles: [observability]
    image: grafana/grafana-oss:latest
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3001:3000"]
    depends_on: [prometheus]

  mlflow:
    networks: [qpnet]
    profiles: [mlops]
    image: ghcr.io/mlflow/mlflow:latest
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlflow/mlflow.db --default-artifact-root /mlflow/artifacts
    volumes: [mlflow:/mlflow]
    ports: ["5000:5000"]

networks:
  qpnet:
    name: querypilot_net

volumes:
  pgdata:
  ollama:
  mlflow:
